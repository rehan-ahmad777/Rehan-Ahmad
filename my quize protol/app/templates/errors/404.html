{% extends "base.html" %}

{% block title %}404 Not Found - Page Missing{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-lg rounded-4 p-5 mx-auto max-w-600 bg-white">
        <div class="icon-shape bg-warning-subtle text-warning-emphasis rounded-circle fs-1 mx-auto mb-3" style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
            <i class="bi bi-compass"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark mb-2">404 Page Not Found</h1>
        <p class="lead text-secondary mb-4">The requested page or exam token link does not exist or has been removed.</p>
        <div>
            <a href="{{ url_for('student.index') }}" class="btn btn-primary rounded-pill px-4 me-2">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
