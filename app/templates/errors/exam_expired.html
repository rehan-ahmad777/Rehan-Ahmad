{% extends "base.html" %}

{% block title %}Exam Link Expired{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-lg rounded-4 p-5 mx-auto max-w-600 bg-white">
        <div class="icon-shape bg-secondary-subtle text-secondary rounded-circle fs-1 mx-auto mb-3" style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
            <i class="bi bi-clock-history"></i>
        </div>
        <h1 class="display-6 fw-bold text-dark mb-2">Exam Link Expired</h1>
        <p class="lead text-secondary mb-4">This exam paper link (Code: <strong>{{ exam.exam_code }}</strong>) is no longer accepting submissions.</p>
        <div>
            <a href="{{ url_for('student.index') }}" class="btn btn-primary rounded-pill px-4">Back to Portal</a>
        </div>
    </div>
</div>
{% endblock %}
