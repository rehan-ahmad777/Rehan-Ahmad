{% extends "base.html" %}

{% block title %}Exam Not Available{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card border-0 shadow-lg rounded-4 p-5 mx-auto max-w-600 bg-white" style="max-width: 600px;">
        <div class="icon-shape bg-danger-subtle text-danger rounded-circle fs-1 mx-auto mb-3" style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
            <i class="bi bi-slash-circle"></i>
        </div>
        <h1 class="display-6 fw-bold text-dark mb-2">This exam is no longer available.</h1>
        <p class="lead text-secondary mb-4">Exam Code: <strong>{{ exam.exam_code if exam else '' }}</strong></p>
        <div>
            <a href="{{ url_for('student.index') }}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house me-1"></i> Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
